name: build
on:
  push:
    branches: [main]
    paths-ignore: [k8s/kustomization.yaml]  # the tag bump below shouldn't rebuild
  workflow_dispatch:

permissions:
  contents: write  # to commit the image tag bump
  packages: write

jobs:
  test-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64  # all homelab nodes are amd64
          tags: |
            ghcr.io/gin-g/mvderby:latest
            ghcr.io/gin-g/mvderby:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Pin the new tag so Argo CD sees a manifest change and rolls the Deployment.
      - name: Bump image tag
        run: |
          sed -i "s/newTag: .*/newTag: sha-${GITHUB_SHA}/" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: sha-${GITHUB_SHA::7} [skip ci]"
          git push
